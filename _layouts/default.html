---
layout: compress
---

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="{{ page.description }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:description" content="{{ page.description }}" />
    <meta
      property="og:image"
      content="{{ site.url }}/line-of-flight-1200x630.jpg?v={{ site.time | date: '%s' }}"
    />
    <meta property="og:site_name" content="{{ site.title }}" />
    <meta property="og:title" content="{{ site.title }} | {{ page.title }}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
    <link rel="icon" href="/favicon.ico?v={{ site.time | date: '%s' }}" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png?v={{ site.time | date: '%s' }}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png?v={{ site.time | date: '%s' }}"
    />
    <style>
      @font-face {
        font-family: "iA Writer Quattro";
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        src: url("/fonts/iAWriterQuattroS-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "iA Writer Quattro";
        font-weight: 700;
        font-style: normal;
        font-display: swap;
        src: url("/fonts/iAWriterQuattroS-Bold.woff2") format("woff2");
      }
      @font-face {
        font-family: "iA Writer Mono";
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        src: url("/fonts/iAWriterMonoS-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "iA Writer Mono";
        font-weight: 700;
        font-style: normal;
        font-display: swap;
        src: url("/fonts/iAWriterMonoS-Bold.woff2") format("woff2");
      }
      :root {
        color-scheme: light dark;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        margin: 0;
        padding: var(--inset-y, clamp(1.25rem, 3vw, 2.5rem)) var(--inset-x, clamp(1.25rem, 3vw, 2.5rem));
        font-family: "iA Writer Quattro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 18px;
        line-height: 1.6;
        color: CanvasText;
        background-color: var(--bg, Canvas);
        -webkit-font-smoothing: antialiased;
      }
      header {
        display: flex;
        align-items: flex-start;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 0.5rem 1rem;
        font-family: "iA Writer Mono", monospace;
      }
      /* The logos sit box to box, so the space between them is just their padding */
      header nav {
        display: flex;
        margin-left: auto;
      }
      header :is(nav a, .loop) {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        color: inherit;
        background: color-mix(in srgb, var(--bg, Canvas) 90%, transparent);
        text-decoration: none;
      }
      /* The music toggle sits snug beside the dial, level with its middle */
      .loop {
        align-self: center;
        margin-left: -1rem;
        padding: 0;
        border: 0;
        font: inherit;
        cursor: pointer;
      }
      /* Tighter boxes on phones, still big enough to tap */
      @media (max-width: 640px) {
        header :is(nav a, .loop) {
          width: 44px;
          height: 44px;
        }
        /* The bars match the height of the hour in the smaller dial */
        .loop svg {
          width: 14px;
          height: 14px;
        }
      }
      /* Level bars: faint while the music is off, full text colour while it plays */
      .loop svg {
        opacity: 0.3;
      }
      .loop:is(:hover, :focus-visible) svg {
        opacity: 0.8;
      }
      .loop[aria-pressed="true"] svg {
        opacity: 1;
      }
      .pixel {
        --pixel-delay: 0ms;
        opacity: 0.3;
        transition: opacity 50ms steps(1, end) var(--pixel-delay);
      }
      header nav a:is(:hover, :focus-visible) .pixel {
        opacity: 0.8;
      }
      @media (prefers-reduced-motion: reduce) {
        .pixel {
          transition: none;
        }
      }
      /* Header and footer stay put inside the border; only the middle scrolls */
      main {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        margin: 4.5rem 0 3rem;
      }
      img {
        max-width: min(100%, 60vw);
        height: auto;
        display: block;
        margin: 0 0.5rem 2rem;
      }
      p {
        margin: 0 0 1.25rem;
      }
      p.lead {
        font-size: clamp(2rem, 4.5vw, 3.25rem);
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      p:not(.lead) {
        max-width: max(60%, 20rem);
      }
      a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      /* Hand-drawn underline, stretched to the width of the text. The shape is
         filled, not stroked, so it can swell and taper like ink from a pen */
      .scribble {
        position: relative;
        display: inline-block;
        padding-bottom: 0.6em;
      }
      .scribble svg {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 0.7em;
        overflow: visible;
        fill: currentColor;
        stroke: currentColor;
        stroke-width: 0.5;
        stroke-linejoin: round;
      }
      footer {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 0.5rem 1rem;
        font-family: "iA Writer Mono", monospace;
        font-size: 0.9rem;
        color: color-mix(in srgb, currentColor 55%, transparent);
      }
      :root {
        --company-name-day: repeating-linear-gradient(
          90deg in srgb,
          #ed2346 0%,
          #f27713 6.25%,
          #e3c000 12.5%,
          #0baa4b 18.75%,
          #009dc4 25%,
          #175cf4 31.25%,
          #713bdc 37.5%,
          #cb249d 43.75%,
          #ed2346 50%
        );
        --company-name-night: linear-gradient(
          90deg,
          color-mix(in srgb, currentColor 35%, transparent) 0%,
          color-mix(in srgb, currentColor 35%, transparent) 8%,
          oklch(0.78 0.24 285) 13%,
          oklch(0.80 0.22 250) 18%,
          oklch(0.82 0.20 205) 23%,
          oklch(0.82 0.24 145) 28%,
          oklch(0.85 0.22 80) 33%,
          oklch(0.80 0.26 25) 38%,
          color-mix(in srgb, currentColor 35%, transparent) 43%,
          color-mix(in srgb, currentColor 35%, transparent) 58%,
          oklch(0.78 0.24 285) 63%,
          oklch(0.80 0.22 250) 68%,
          oklch(0.82 0.20 205) 73%,
          oklch(0.82 0.24 145) 78%,
          oklch(0.85 0.22 80) 83%,
          oklch(0.80 0.26 25) 88%,
          color-mix(in srgb, currentColor 35%, transparent) 93%,
          color-mix(in srgb, currentColor 35%, transparent) 100%
        );
      }
      footer .company-name {
        display: inline-block;
        color: CanvasText;
        background-image: var(--company-name-gradient, var(--company-name-day));
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: strobe 1.4s linear infinite;
      }
      @keyframes strobe {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: 0% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        footer .company-name {
          animation: none;
          background-image: none;
          -webkit-text-fill-color: currentColor;
          color: inherit;
        }
      }
      footer a {
        color: inherit;
      }
      footer span {
        white-space: nowrap;
      }
      /* Near-opaque panels keep text readable over the background art */
      p,
      footer > *,
      footer .company-info,
      footer .footer-email {
        width: fit-content;
        padding: 0.15em 0.5rem;
        background: color-mix(in srgb, var(--bg, Canvas) 90%, transparent);
      }
      @media (min-width: 1025px) {
        .footer-bar {
          display: contents;
        }
        .footer-bar .footer-email {
          margin-left: auto;
        }
        .footer-email-sep {
          display: none;
        }
      }
      @media (max-width: 1024px) {
        .footer-bar .company-info {
          display: contents;
          white-space: normal;
        }
        .footer-bar .footer-email {
          padding: 0;
          background: none;
        }
      }
      /* Time-of-day dial, drawn in 4px blocks: a 24-hour clock with midnight at the
         top, running clockwise, with the hour in the middle */
      .dial {
        width: 68px;
        height: 68px;
        image-rendering: pixelated;
        background: color-mix(in srgb, var(--bg, Canvas) 90%, transparent);
        cursor: grab;
        touch-action: none;
      }
      .dial:active {
        cursor: grabbing;
      }
      /* The dial is drawn in whole pixels, so on phones it steps from four to three per cell */
      @media (max-width: 640px) {
        .dial {
          width: 51px;
          height: 51px;
        }
      }
    </style>
    <script>
      (function () {
        /* The background follows the light of the day, across the whole range and
           regardless of the system light or dark setting: dark night, violet blue hour,
           rose dawn, golden morning, white noon, golden hour, coral sunset, violet dusk.
           Keyframes are OKLCH, blended in OKLab so the steps between them look
           perceptually even. */
        var root = document.documentElement;
        var sky = [
          [0, "0.16 0.02 265"],
          [5.5, "0.18 0.025 280"],
          [6.5, "0.88 0.035 20"],
          [8, "0.96 0.025 75"],
          [13, "1 0 0"],
          [18, "0.95 0.035 70"],
          [19.5, "0.86 0.04 35"],
          [20.5, "0.3 0.04 290"],
          [22, "0.18 0.025 270"],
          [24, "0.16 0.02 265"]
        ];
        var shown = 0;
        var held = false;

        function now() {
          var d = new Date();
          return d.getHours() + d.getMinutes() / 60;
        }

        var pen;
        var inked;

        /* Redraw the underline with an unsteady hand: every point of the pen stroke
           shifts up or down a touch, so no two underlines are quite alike */
        function ink() {
          var path = document.querySelector(".scribble path");
          if (!path) return;
          pen = pen || path.getAttribute("d");
          var nudged = {};
          var d = pen.replace(/([\d.]+) ([\d.]+)/g, function (point, x, y) {
            /* A repeated point moves the same way each time, which keeps the outline closed */
            nudged[point] = nudged[point] || x + " " + (+y + (Math.random() - 0.5) * 0.7).toFixed(2);
            return nudged[point];
          });
          /* Now and then the nib lets go of a little ink, which pools under the line: a faint,
             lopsided swelling towards the end of the stroke, never a tidy dot */
          if (Math.random() < 0.15) {
            var box = path.ownerSVGElement.getBoundingClientRect();
            var x = 185 + Math.random() * 60;
            /* Just below the middle of the stroke at that point, so the pool hangs from it */
            var y = 4.15 - x / 200 + Math.random() * 0.2;
            var size = 0.55 + Math.random() * 0.3;
            /* The drawing stretches to the width of the text, so widths are scaled to match,
               then stretched further because ink spreads along the line */
            var wide = 30 * box.height / box.width * (2.5 + Math.random() * 2);
            /* Six points around the middle, each a different distance out, clockwise like the stroke */
            var rim = [];
            for (var i = 0; i < 6; i++) {
              var angle = (i + Math.random() * 0.7) / 6 * 2 * Math.PI;
              var reach = size * (0.65 + Math.random() * 0.6);
              rim.push([x + reach * wide * Math.cos(angle), y + reach * Math.sin(angle)]);
            }
            /* The outline curves round each point, from one halfway mark to the next */
            var halfway = function (n) {
              var next = rim[(n + 1) % 6];
              return (rim[n][0] + next[0]) / 2 + " " + (rim[n][1] + next[1]) / 2;
            };
            d += "M" + halfway(5);
            for (i = 0; i < 6; i++) d += "Q" + rim[i].join(" ") + " " + halfway(i);
            d += "Z";
          }
          path.setAttribute("d", d);
        }

        function updateGreeting(h) {
          var el = document.getElementById("greeting");
          if (!el) return;
          var text = "Still up?";
          if (h >= 5 && h < 8) text = "Early start?";
          else if (h >= 8 && h < 23) text = "Hello!";
          if (text === inked) return;
          inked = el.textContent = text;
          ink();
        }

        function tint(hour) {
          shown = (hour % 24 + 24) % 24;
          var i = 1;
          while (sky[i][0] < shown) i++;
          var a = sky[i - 1];
          var b = sky[i];
          var t = (shown - a[0]) / (b[0] - a[0]);
          var lightness = parseFloat(a[1]) * (1 - t) + parseFloat(b[1]) * t;
          root.style.setProperty("--bg", "color-mix(in oklab, oklch(" + a[1] + ") " + ((1 - t) * 100).toFixed(1) + "%, oklch(" + b[1] + "))");
          /* Flip to light text where black and white contrast equally with the background */
          root.style.colorScheme = lightness < 0.565 ? "dark" : "light";
          root.style.setProperty("--company-name-gradient", lightness < 0.565 ? "var(--company-name-night)" : "var(--company-name-day)");
          updateGreeting(shown);
          window.dispatchEvent(new Event("daylight"));
        }

        tint(now());
        setInterval(function () {
          if (!held) tint(now());
        }, 60000);

        document.addEventListener("DOMContentLoaded", function () {
          updateGreeting(shown);
          /* Each pixel icon in the nav lights up in a fresh random order on every hover */
          document.querySelectorAll("header nav a").forEach(function (link) {
            var pixels = Array.from(link.querySelectorAll(".pixel"));
            if (!pixels.length) return;
            function shufflePixels() {
              var order = pixels.slice();
              for (var i = order.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var pixel = order[i];
                order[i] = order[j];
                order[j] = pixel;
              }
              order.forEach(function (pixel, index) {
                pixel.style.setProperty("--pixel-delay", (index * 250 / (order.length - 1)).toFixed(3) + "ms");
              });
            }
            shufflePixels();
            link.addEventListener("pointerenter", shufflePixels);
            link.addEventListener("focus", function () {
              if (link.matches(":focus-visible")) shufflePixels();
            });
          });
          var dial = document.querySelector(".dial");
          if (!dial) return;
          var ctx = dial.getContext("2d");
          var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          var idle = null;

          /* 3 by 5 pixel digits, row by row */
          var glyphs = [
            "111101101101111", "010110010010111", "111001111100111", "111001111001111", "101101111001001",
            "111100111001111", "111100111101111", "111001001001001", "111101111101111", "111101111001111"
          ];

          function draw() {
            var h = Math.floor(shown);
            var m = Math.floor((shown - h) * 60);
            dial.setAttribute("aria-valuenow", h);
            dial.setAttribute("aria-valuetext", (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m);

            ctx.clearRect(0, 0, 17, 17);
            ctx.fillStyle = getComputedStyle(document.body).color;
            /* Faint ring of blocks, with ticks at 0, 6, 12 and 18 */
            ctx.globalAlpha = 0.3;
            for (var y = 0; y < 17; y++) {
              for (var x = 0; x < 17; x++) {
                if (Math.abs(Math.hypot(x - 8, y - 8) - 7) < 0.5) ctx.fillRect(x, y, 1, 1);
              }
            }
            ctx.fillRect(8, 0, 1, 1);
            ctx.fillRect(16, 8, 1, 1);
            ctx.fillRect(8, 16, 1, 1);
            ctx.fillRect(0, 8, 1, 1);
            /* Marker, 3 by 3, on the ring */
            var angle = shown / 12 * Math.PI;
            var sx = Math.round(8 + 7 * Math.sin(angle));
            var sy = Math.round(8 - 7 * Math.cos(angle));
            ctx.globalAlpha = 0.8;
            ctx.fillRect(sx - 1, sy - 1, 3, 3);
            /* Hour in the middle, 00 to 23 */
            [Math.floor(h / 10), h % 10].forEach(function (d, n) {
              for (var i = 0; i < 15; i++) {
                if (glyphs[d][i] === "1") ctx.fillRect(5 + n * 4 + i % 3, 6 + Math.floor(i / 3), 1, 1);
              }
            });
          }

          /* Ease back to the real time of day, the short way round the clock */
          function settle() {
            held = false;
            var from = shown;
            var delta = ((now() - from + 36) % 24) - 12;
            if (reduced) return tint(from + delta);
            var start = performance.now();
            requestAnimationFrame(function step(t) {
              if (held) return;
              var p = Math.min(1, (t - start) / 1200);
              tint(from + delta * (1 - Math.pow(1 - p, 3)));
              if (p < 1) requestAnimationFrame(step);
            });
          }

          /* Midnight at the top, clockwise */
          function point(e) {
            var r = dial.getBoundingClientRect();
            var angle = Math.atan2(e.clientX - r.left - r.width / 2, r.top + r.height / 2 - e.clientY);
            tint(angle / Math.PI * 12);
          }

          dial.addEventListener("pointerdown", function (e) {
            held = true;
            dial.setPointerCapture(e.pointerId);
            point(e);
          });
          dial.addEventListener("pointermove", function (e) {
            if (held) point(e);
          });
          dial.addEventListener("pointerup", settle);
          dial.addEventListener("pointercancel", settle);
          dial.addEventListener("keydown", function (e) {
            var step = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
            if (!step) return;
            e.preventDefault();
            held = true;
            tint(shown + step);
            clearTimeout(idle);
            idle = setTimeout(settle, 1500);
          });
          window.addEventListener("daylight", draw);
          draw();
        });
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Line of Flight",
        "legalName": "Line of Flight B.V.",
        "description": {{ page.description | jsonify }},
        "url": "{{ site.url }}",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Amsterdam",
          "addressCountry": "NL"
        },
        "vatID": "NL865329564B01",
        "iso6523Code": "0106:90477014",
        "founder": {
          "@type": "Person",
          "name": "Hakan Ensari",
          "url": "https://hakanensari.com"
        },
        "logo": "https://lineofflig.ht/17c6170a.jpg",
        "contactPoint": [
          {
            "@type": "ContactPoint",
            "email": "company@lineofflig.ht",
            "contactType": "General Inquiry"
          }
        ],
        "sameAs": [
          "https://github.com/lineofflight",
          "https://huggingface.co/lineofflight",
          "https://www.linkedin.com/company/lineofflight"
        ]
      }
    </script>
    <title>{{ site.title }} | {{ page.title }}</title>

  <body>
    {% include frame.html figure=page.figure %}
    <header>
      <canvas class="dial" width="17" height="17" role="slider" tabindex="0" aria-label="Time of day" aria-valuemin="0" aria-valuemax="23" title="Time of day"></canvas>
      <button class="loop" type="button" aria-pressed="false" aria-label="Play music" title="Play music">
        <svg viewBox="0 0 14 14" width="21" height="21" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
          <path d="M0 9h2v5H0ZM4 6h2v8H4ZM8 3h2v11H8ZM12 0h2v14h-2Z"/>
        </svg>
      </button>
      <nav>
        <a href="https://huggingface.co/lineofflight" target="_blank" rel="noopener" aria-label="Hugging Face" title="Hugging Face">
          <svg viewBox="0 0 20 20" width="26" height="26" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
            <defs>
              <clipPath id="huggingface-shape">
                <path d="M6 0h8v1H6Z
                  M4 1h12v1H4Z
                  M3 2h14v1H3Z
                  M2 3h16v1H2Z
                  M2 4h16v1H2Z
                  M1 5h5v1H1ZM8 5h4v1H8ZM14 5h5v1h-5Z
                  M1 6h5v1H1ZM8 6h4v1H8ZM14 6h5v1h-5Z
                  M1 7h5v1H1ZM8 7h4v1H8ZM14 7h5v1h-5Z
                  M1 8h18v1H1Z
                  M1 9h5v1H1ZM14 9h5v1h-5Z
                  M1 10h4v1H1ZM15 10h4v1h-4Z
                  M1 11h5v1H1ZM14 11h5v1h-5Z
                  M2 12h5v1H2ZM13 12h5v1h-5Z
                  M5 13h4v1H5ZM11 13h4v1h-4Z
                  M1 14h4v1H1ZM6 14h8v1H6ZM15 14h4v1h-4Z
                  M0 15h5v1H0ZM6 15h8v1H6ZM15 15h5v1h-5Z
                  M0 16h5v1H0ZM7 16h6v1H7ZM15 16h5v1h-5Z
                  M0 17h5v1H0ZM7 17h6v1H7ZM15 17h5v1h-5Z
                  M1 18h4v1H1ZM15 18h4v1h-4Z"/>
              </clipPath>
            </defs>
            <g clip-path="url(#huggingface-shape)">
              {% for pixel in (0..99) %}
                {% assign x = pixel | modulo: 10 | times: 2 %}
                {% assign y = pixel | divided_by: 10 | times: 2 %}
                <rect class="pixel" x="{{ x }}" y="{{ y }}" width="2" height="2"/>
              {% endfor %}
            </g>
          </svg>
        </a>
        <a href="https://github.com/lineofflight" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
          <svg viewBox="0 0 20 20" width="26" height="26" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
            <defs>
              <clipPath id="github-shape">
                <path d="M3 0h1v1H3ZM17 0h1v1H17Z
                  M3 1h2v1H3ZM16 1h2v1H16Z
                  M3 2h15v1H3Z
                  M2 3h17v1H2Z
                  M2 4h6v1H2ZM13 4h6v1H13Z
                  M2 5h4v1H2ZM15 5h4v1H15Z
                  M2 6h3v1H2ZM6 6h2v1H6ZM13 6h2v1H13ZM16 6h3v1H16Z
                  M2 7h3v1H2ZM6 7h2v1H6ZM13 7h2v1H13ZM16 7h3v1H16Z
                  M2 8h3v1H2ZM16 8h3v1H16Z
                  M3 9h2v1H3ZM9 9h3v1H9ZM16 9h2v1H16Z
